<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Prevent ALL caching for Telegram WebApp -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Telegram WebApp specific meta tags -->
    <meta name="telegram-web-app-cache-control" content="no-cache" />
    <meta name="telegram-web-app-version" content="v2.0.2" />
    <!-- iOS specific meta tags for fullscreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Raleway font for AguGram brand -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>AguGram - Студенческая соцсеть</title>
    <!-- Telegram WebApp script - load before app for immediate initialization -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Immediately expand and initialize Telegram WebApp before React loads
      (function() {
        if (window.Telegram && window.Telegram.WebApp) {
          var tg = window.Telegram.WebApp;
          var version = tg.version ? parseFloat(tg.version) : 6.0;
          
          // Signal ready state
          tg.ready();
          // Expand to full height
          tg.expand();
          
          // Set theme colors (requires version 6.1+)
          if (version >= 6.1) {
            try {
              if (tg.setHeaderColor) tg.setHeaderColor('#000000');
              if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
            } catch(e) {}
          }
          
          // Disable vertical swipes (requires version 7.7+)
          if (version >= 7.7 && tg.disableVerticalSwipes) {
            try { tg.disableVerticalSwipes(); } catch(e) {}
          }
          
          // Request fullscreen (requires version 8.0+)
          if (version >= 8.0 && tg.requestFullscreen) {
            try { tg.requestFullscreen().catch(function() {}); } catch(e) {}
          }
          
          // Set viewport height CSS variable
          document.documentElement.style.setProperty('--tg-viewport-height', (tg.viewportStableHeight || window.innerHeight) + 'px');
        }
      })();
    </script>
    <style>
      /* Critical CSS for preventing flash of unstyled content */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #000000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
